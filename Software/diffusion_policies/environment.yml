name: diffusion_policies
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.8
  
  # PyTorch ecosystem
  - pytorch=1.13.1
  - torchvision=0.14.1
  - torchaudio=0.13.1
  - pytorch-cuda=11.7
  
  # Core ML/DL libraries
  - numpy=1.24.3
  - scipy=1.10.1
  - scikit-learn=1.2.2
  
  # Computer Vision
  - opencv=4.7.1
  - pillow=9.5.0
  
  # Data handling
  - pandas=2.0.1
  - h5py=3.8.0
  - zarr=2.14.2
  - numcodecs=0.11.0
  
  # Configuration and utilities
  - hydra-core=1.3.2
  - omegaconf=2.3.0
  - termcolor=2.3.0
  - tqdm=4.65.0
  - pyyaml=6.0
  
  # Visualization and logging
  - matplotlib=3.7.1
  - seaborn=0.12.2
  - tensorboard=2.12.3
  
  # Development tools
  - jupyter=1.0.0
  - ipython=8.12.0
  
  # System utilities
  - psutil=5.9.5
  
  # pip dependencies
  - pip
  - pip:
    # Diffusion models
    - diffusers==0.17.1
    - transformers==4.30.2
    - accelerate==0.20.3
    
    # Robotics libraries
    - ur-rtde==1.5.5
    - pyrealsense2==2.54.1
    - keyboard==0.13.5
    
    # ML utilities
    - wandb==0.15.4
    - einops==0.6.1
    - timm==0.9.2
    
    # Data processing
    - imagecodecs-numcodecs==2023.1.23
    - imageio==2.31.1
    - imageio-ffmpeg==0.4.8
    
    # Robomimic (if needed)
    - robomimic==0.3.0
    
    # Additional utilities
    - rich==13.4.2
    - click==8.1.3
    - dataclasses-json==0.5.9