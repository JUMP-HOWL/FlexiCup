<!DOCTYPE html>
<html>
<head>
    <title>Hover Test</title>
    <style>
        .hover-container {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
            width: 500px;
            margin: 50px auto;
        }
        .hover-container img {
            width: 100%;
            display: block;
            transition: opacity 0.3s ease;
        }
        .hover-img {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
        }
        .caption {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
            min-height: 40px;
        }
    </style>
</head>
<body>
    <h1>CFD Simulation Hover Test</h1>
    
    <div class="hover-container" id="testContainer">
        <img id="defaultImg" src="./static/images/image/FigDualMode.png" alt="Default" />
        <img id="hoverImg" class="hover-img" src="./static/images/image/ResCupsSim.png" alt="Hover" />
    </div>
    
    <p id="testCaption" class="caption">
        Default: Mechanical configurations
    </p>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('testContainer');
            const defaultImg = document.getElementById('defaultImg');
            const hoverImg = document.getElementById('hoverImg');
            const caption = document.getElementById('testCaption');

            container.addEventListener('mouseenter', () => {
                console.log('Mouse enter');
                defaultImg.style.opacity = '0';
                hoverImg.style.opacity = '1';
                caption.textContent = 'Hover: CFD simulation results';
            });

            container.addEventListener('mouseleave', () => {
                console.log('Mouse leave');
                defaultImg.style.opacity = '1';
                hoverImg.style.opacity = '0';
                caption.textContent = 'Default: Mechanical configurations';
            });
        });
    </script>
</body>
</html>
